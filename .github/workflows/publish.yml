name: Refresh and publish CFMI rankings

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '0 9 * * 0'
      timezone: America/New_York
    - cron: '0 20 * * 0' # AP poll post-publication check
      timezone: America/New_York
    - cron: '0 23 * * 2' # CFP poll post-publication check
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: cfmi-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch and validate CFMI data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all-FBS historical roster talent and returning-production releases
        run: |
          python -m pip install duckdb==1.4.2 pandas==2.3.3
          python scripts/probe_sdv_historical.py
      - name: Research historical preseason roster talent source coverage
        run: python scripts/probe_talent_sources.py
      - name: Collect and independently audit 2024-2026 historical roster talent
        run: python scripts/collect_talent_research.py
      - name: Audit exact 2026 rushing and passing source fields
        run: python scripts/probe_matchup_fields.py
      - name: Download 2026 scores and advanced statistics
        run: python scripts/update_data.py
      - name: Refresh published AP and CFP poll snapshots
        run: python scripts/update_polls.py
      - name: Refresh FPI, SP+ and FEI comparative power ratings
        run: python scripts/update_external_rankings.py
      - name: Build unbiased game-state WP and verified possession metrics
        run: |
          python -m pip install numpy==2.2.6 duckdb==1.4.2
          python scripts/train_neutral_wp.py
          python scripts/update_possessions.py
      - name: Generate 2024–2025 historical game-level evaluation feeds
        run: |
          CFMI_SEASON=2024 python scripts/update_data.py
          CFMI_SEASON=2024 python scripts/update_possessions.py
          CFMI_SEASON=2025 python scripts/update_data.py
          CFMI_SEASON=2025 python scripts/update_possessions.py
      - name: Collect full-FBS talent returning production and transfer inputs by season
        run: python scripts/collect_preseason_all_fbs.py
      - name: Fit and verify V5 predictive coefficients on earlier seasons
        run: node scripts/train_v5.cjs
      - name: Evaluate joint offense-defense opponent-network efficiency
        run: node scripts/test_joint_opponent_network.cjs
      - name: Evaluate incremental opponent reliability correction on 2024 train / 2025 validation
        run: node scripts/test_opponent_corrections.cjs
      - name: Promote validated joint opponent-network Power or retain reference
        run: node scripts/promote_opponent_network.cjs
      - name: Diagnose current opponent strength and rating contributions
        run: node scripts/diagnose_opponent_strength.cjs
      - name: Research rapidly fading talent and last-season Power prior on matched games
        run: node scripts/test_talent_prior.cjs
      - name: Validate full FBS talent returning and portal preseason Power candidates
        run: node scripts/test_full_preseason_prior.cjs
      - name: Create Week0 all-FBS talent and continuity Power ratings
        run: node scripts/build_preseason_week0.cjs
      - name: Simulate exploratory 2026 preseason playoff and championship outlook
        run: node scripts/build_preseason_playoff_forecast.cjs
      - name: Reconstruct baseline Power-only pregame ledger for matchup training
        run: CFMI_MATCHUP_DISABLED=1 node scripts/build_prediction_ledger.cjs
      - name: Fit historical matchup residual and select only if 2025 validation improves
        run: node scripts/train_matchup_v1.cjs
      - name: Generate final matchup-aware weekly predictions
        run: node scripts/build_weekly_views.cjs
      - name: Reconstruct game-ahead CFMI Matchup Score predictions for 2025 and 2026
        run: node scripts/build_prediction_ledger.cjs
      - name: Research original-dated 2025 weekly FPI and FEI rating archives
        run: |
          python -m pip install beautifulsoup4==4.14.2
          python scripts/probe_2025_industry.py
      - name: Benchmark same-game historic CFMI versus FPI SP+ and FEI, and diagnose misses
        run: python scripts/benchmark_power_2025_2026.py
      - name: Analyze prediction mistakes and 2025-selected home-field counterfactuals
        run: node scripts/analyze_power_misses.cjs
      - name: Audit V5 model, weekly data quality and season cutoff invariants
        run: node scripts/audit_dashboard.cjs
      - name: Enforce v6 public metric lineage and full-FBS reconciliation
        run: node scripts/test_metric_view_contract.cjs
      - name: Build independently reproducible public Merit-Power audit dataset
        run: node scripts/build_public_metric_audit.cjs
      - name: Historical V4 versus V3 walk-forward benchmark (reference only)
        run: |
          node scripts/backtest_v4.cjs
          node scripts/evaluate_power_candidates.cjs
      - name: Verify all seven dashboard tabs in Chromium
        run: |
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
          node scripts/smoke_dashboard.cjs
      - name: Remove raw historical feeds from the public site
        run: rm -rf site/data/history
      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: Publish CFMI to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        id: pages
        uses: actions/deploy-pages@v4
