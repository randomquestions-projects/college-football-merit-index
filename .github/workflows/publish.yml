name: Refresh and publish CFMI rankings

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0'
      timezone: America/New_York
    - cron: '0 20 * * 0' # AP poll post-publication check
      timezone: America/New_York
    - cron: '0 23 * * 2' # CFP poll post-publication check
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: cfmi-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch and validate CFMI data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 2026 scores and advanced statistics
        run: python scripts/update_data.py
      - name: Refresh published AP and CFP poll snapshots
        run: python scripts/update_polls.py
      - name: Refresh FPI, SP+ and FEI comparative power ratings
        run: python scripts/update_external_rankings.py
      - name: Inspect historical 2026 FPI SP+ FEI source-date coverage
        run: python scripts/probe_2026_rating_history.py
      - name: Build unbiased game-state WP and verified possession metrics
        run: |
          python -m pip install numpy==2.2.6 duckdb==1.4.2
          python scripts/train_neutral_wp.py
          python scripts/update_possessions.py
      - name: Generate 2024–2025 historical game-level evaluation feeds
        run: |
          CFMI_SEASON=2024 python scripts/update_data.py
          CFMI_SEASON=2024 python scripts/update_possessions.py
          CFMI_SEASON=2025 python scripts/update_data.py
          CFMI_SEASON=2025 python scripts/update_possessions.py
      - name: Fit and verify V5 predictive coefficients on earlier seasons
        run: node scripts/train_v5.cjs
      - name: Compare 2026 CFMI Power with original-source-dated pregame FPI SP+ FEI
        run: python scripts/benchmark_2026_external.py
      - name: Reconstruct weekly V5 history and upcoming matchup predictions
        run: node scripts/build_weekly_views.cjs
      - name: Audit V5 model, weekly data quality and season cutoff invariants
        run: node scripts/audit_dashboard.cjs
      - name: Historical V4 versus V3 walk-forward benchmark (reference only)
        run: |
          node scripts/backtest_v4.cjs
          node scripts/evaluate_power_candidates.cjs
      - name: Verify all six dashboard tabs in Chromium
        run: |
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
          node scripts/smoke_dashboard.cjs
      - name: Remove raw historical feeds from the public site
        run: rm -rf site/data/history
      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: Publish CFMI to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        id: pages
        uses: actions/deploy-pages@v4
