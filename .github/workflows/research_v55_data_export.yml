name: CFMI v5.5 research-only advanced history export
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-advanced-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install possession extraction dependencies
        run: python -m pip install numpy==2.2.6 duckdb==1.4.2
      - name: Train unbiased historic game-state WP for garbage-time removal
        run: python scripts/train_neutral_wp.py
      - name: Regenerate historical FBS advanced and possession metrics
        run: |
          CFMI_SEASON=2024 python scripts/update_data.py
          CFMI_SEASON=2024 python scripts/update_possessions.py
          CFMI_SEASON=2025 python scripts/update_data.py
          CFMI_SEASON=2025 python scripts/update_possessions.py
      - name: Export history for isolated research (never to public site)
        uses: actions/upload-artifact@v4
        with:
          name: cfmi-v55-historical-advanced-inputs
          path: |
            site/data/history/2024/cfmi_advanced_2024.csv
            site/data/history/2025/cfmi_advanced_2025.csv
            site/data/history/2024/cfb_schedules_2024.csv
            site/data/history/2025/cfb_schedules_2025.csv
            site/data/history/2024/possession_metadata.json
            site/data/history/2025/possession_metadata.json
          retention-days: 7
